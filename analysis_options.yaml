analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

# Project-specific tweaks can go here. Defaults from flutter_lints are used;
# none are promoted to errors, so lints won't block a build.
linter:
  rules:
    avoid_print: false
